services:
  patient-service-database:
    image: postgres:18
    container_name: patient-service-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db
    ports:
      - "5000:5432"
    volumes:
      - ./db_volumes/patient-service-db:/var/lib/postgresql
    networks:
      - rede-interna
  
  patient-service:
    build: ./patience-service
    container_name: patient-service
    restart: always
    depends_on:
      - patient-service-database
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      BILLING_SERVICE_ADDRESS: ${BILLING_SERVICE_ADDRESS}
      BILLING_SERVICE_GRPC_PORT: ${BILLING_SERVICE_GRPC_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - rede-interna

  billing-service:
    build: ./billing-service
    container_name: billing-service
    restart: always
    ports:
      - "4001:4001"
      - "9001:9001"
    networks:
      - rede-interna

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    restart: always
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      -  "4002:4002"
    networks:
      - rede-interna

  kafka:
    image: apache/kafka:4.2.1
    ports:
      -  "9092:9092"
      -  "9094:9094"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    networks:
      - rede-interna

  kafka-ui:
    image: kafbat/kafka-ui:aa21129
    ports:
      -  "8080:8080"
    environment:
      -  DYNAMIC_CONFIG_ENABLED=true
    networks:
      -  rede-interna

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      -  "4004:4004"
    networks:
      - rede-interna

networks:
  rede-interna:
    driver: bridge